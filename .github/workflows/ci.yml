name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ingresso
          POSTGRES_PASSWORD: ingresso
          POSTGRES_DB: ultimo_ingresso_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ingresso -d ultimo_ingresso_teste"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL_TESTE: postgres://ingresso:ingresso@localhost:5432/ultimo_ingresso_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Testes de integração (PostgreSQL real)
        run: npm test
      - run: npm run build

  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem Docker
        run: docker build -t ultimo-ingresso .
